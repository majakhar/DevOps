replicaCount: 1

image:
  repository: "calc"
  pullPolicy: IfNotPresent
  tag: "v0.1"

service:
  type: ClusterIP
  port: 80
  targetPort: 8083

ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: false
  name: null

readinessProbe:
  httpGet:
    path: /
    port: 8083
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /
    port: 8083
  initialDelaySeconds: 10
  periodSeconds: 20
  failureThreshold: 5

resources: {}
